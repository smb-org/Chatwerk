<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17181B" />
    <title>Chatwerk Studio</title>
  </head>
  <body>
    <div class="studio-shell">
      <header class="studio-header">
        <a class="wordmark" href="/studio" data-i18n="brand">Chatwerk</a>
        <nav class="top-nav" data-i18n-aria-label="primaryNavigation">
          <a href="/studio" aria-current="page" data-i18n="studioTitle">Studio</a>
          <a href="/themes" data-i18n="themes"></a>
        </nav>
        <span class="active-overlay-label" id="active-overlay-name">
          <span id="active-overlay-text"></span>
          <select id="active-overlay-select" data-i18n-aria-label="activeOverlayLabel" hidden></select>
        </span>
        <div class="channel-header-field" id="channel-header-field">
          <button class="channel-field-button" id="channel-field-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="channel-popover" data-i18n-aria-label="channelFieldLabel">
            <span id="channel-field-text"></span><span id="channel-field-count" hidden></span>
          </button>
          <div class="channel-popover" id="channel-popover" role="dialog" data-i18n-aria-label="channelFieldLabel" hidden></div>
        </div>
        <div class="header-spacer"></div>
        <div class="link-copy">
          <label class="visually-hidden" for="overlay-url" data-i18n="overlayLink"></label>
          <input id="overlay-url" type="text" readonly data-i18n-aria-label="overlayLink" />
          <button class="button" id="copy-link" type="button" data-i18n="copy" data-i18n-aria-label="copyOverlayLink"></button>
          <span class="obs-size-hint" id="obs-size-hint" aria-live="polite"></span>
        </div>
        <div class="connection-chip" id="connection-chip" aria-live="polite" data-count="0" data-i18n="connectionUnknown"></div>
        <details class="account-menu" id="account-menu">
          <summary data-i18n="account"></summary>
          <div class="account-popover">
            <button type="button" id="open-overlays" data-i18n="overlays"></button>
            <button type="button" id="open-looks" data-i18n="myLooks"></button>
            <a id="export-link" href="/studio/export" data-i18n="widgetExport"></a>
            <span class="visually-hidden" id="language-label" data-i18n="language"></span>
            <button type="button" id="language-en" data-i18n="english"></button>
            <button type="button" id="language-de" data-i18n="german"></button>
            <button type="button" id="logout" data-i18n="logOut"></button>
          </div>
        </details>
      </header>

      <main class="workspace" id="workspace">
        <section class="preview-column" data-i18n-aria-label="preview">
          <div class="preview-toolbar">
            <span class="toolbar-label" data-i18n="background"></span>
            <fieldset class="radio-row" id="preview-background-group" data-i18n-aria-label="background">
              <legend class="visually-hidden" data-i18n="background"></legend>
              <label><input type="radio" name="preview-background" value="checker" checked /><span data-i18n="backgroundChecker"></span></label>
              <label><input type="radio" name="preview-background" value="dark" /><span data-i18n="backgroundDark"></span></label>
              <label><input type="radio" name="preview-background" value="light" /><span data-i18n="backgroundLight"></span></label>
              <label><input type="radio" name="preview-background" value="mine" /><span data-i18n="backgroundMine"></span></label>
            </fieldset>
            <label class="file-input" for="preview-background-file" data-i18n="backgroundImage"></label>
            <input class="file-input" id="preview-background-file" type="file" accept="image/*" data-i18n-aria-label="backgroundImage" />
            <div class="preview-size-control">
              <label class="toolbar-label" for="preview-size-preset" data-i18n="previewSourceSize"></label>
              <select class="preview-size-select" id="preview-size-preset" data-i18n-aria-label="previewSourceSize">
                <option value="400x600" data-i18n="sourceSize400x600"></option>
                <option value="300x900" data-i18n="sourceSize300x900"></option>
                <option value="1920x1080" data-i18n="sourceSize1920x1080"></option>
                <option value="custom" data-i18n="sourceSizeCustom"></option>
              </select>
              <div class="preview-custom-size" id="preview-custom-size" hidden>
                <label class="visually-hidden" for="preview-custom-width" data-i18n="sourceSizeWidth"></label>
                <input class="preview-size-input" id="preview-custom-width" type="number" min="100" max="3840" step="1" inputmode="numeric" data-i18n-aria-label="sourceSizeWidth" />
                <span aria-hidden="true">×</span>
                <label class="visually-hidden" for="preview-custom-height" data-i18n="sourceSizeHeight"></label>
                <input class="preview-size-input" id="preview-custom-height" type="number" min="100" max="2160" step="1" inputmode="numeric" data-i18n-aria-label="sourceSizeHeight" />
                <button class="small-button" id="preview-custom-apply" type="button" data-i18n="sourceSizeApply"></button>
                <span class="preview-size-error" id="preview-size-error" role="status" hidden data-i18n="invalidSourceSize"></span>
              </div>
            </div>
            <div class="preview-actions">
              <button class="small-button" id="choose-background" type="button" data-i18n="chooseImage"></button>
              <button class="small-button" id="preview-fit" type="button" aria-pressed="true" data-i18n="previewFit"></button>
              <button class="small-button" id="preview-one-to-one" type="button" aria-pressed="false" data-i18n="previewOneToOne"></button>
            </div>
          </div>
          <div class="preview-window" id="preview-window" data-background="checker">
            <div class="sample-label preview-mode-chip" role="group" data-i18n-aria-label="previewChatMode">
              <button id="preview-mode-sample" type="button" aria-pressed="true" data-i18n="sampleMode"></button>
              <button id="preview-mode-live" type="button" aria-pressed="false" data-i18n="liveMode"></button>
            </div>
            <p class="live-chat-status" id="live-chat-status" role="status" aria-live="polite" hidden></p>
            <p class="live-no-channel-message" id="live-no-channel-message" data-i18n="noChannel" hidden></p>
            <div class="preview-frame-wrap" id="preview-frame-wrap">
              <iframe id="studio-preview" width="400" height="600" data-i18n-title="sampleChat" sandbox="allow-scripts" src="/overlay#client=studio" tabindex="-1"></iframe>
            </div>
            <div class="preview-meta"><span id="preview-scale" data-i18n="previewScale" data-percent=""></span></div>
          </div>
          <div class="mobile-warning" data-i18n="editingWide"></div>
        </section>

        <aside class="settings-panel" data-i18n-aria-label="settings">
          <div class="status-row" id="status-row">
            <span class="status-text" id="status-visible" aria-live="off" data-i18n="loading"></span>
            <span class="status-announcer" id="status-announcer" aria-live="polite"></span>
            <span class="error-area" id="save-error" role="alert"></span>
            <button class="small-button undo-look-button" id="undo-look" type="button" data-i18n="undo" hidden></button>
          </div>
          <div class="warning-row" id="warning-row" aria-live="polite"></div>
          <div class="settings-scroll" id="settings-scroll">
            <div id="theme-controls"></div>
          </div>
        </aside>
      </main>

      <footer class="rehearse-footer" data-i18n-aria-label="rehearse">
        <section class="first-run" id="first-run" data-i18n-aria-label="firstRun">
          <span class="first-run-title" data-i18n="firstRunTitle"></span>
          <div class="first-run-step">
            <span class="first-run-text" data-i18n="firstRunChoose"></span>
            <div class="first-run-options" role="group" data-i18n-aria-label="outputPlatform">
              <button type="button" data-platform="obs" aria-pressed="true" data-i18n="firstRunObs"></button>
              <button type="button" data-platform="streamelements" aria-pressed="false" data-i18n="firstRunStreamElements"></button>
              <button type="button" data-platform="soundalerts" aria-pressed="false" data-i18n="firstRunSoundAlerts"></button>
            </div>
          </div>
          <span class="first-run-text first-run-step" data-i18n="firstRunCopy"></span>
          <span class="first-run-text" data-i18n="firstRunConnect"></span>
          <button class="button" id="first-run-done" type="button" data-i18n="firstRunDone"></button>
        </section>
        <section class="rehearse-tools" id="rehearse-tools" data-i18n-aria-label="rehearseControls">
          <span class="footer-title" data-i18n="rehearse"></span>
          <div class="scenario-buttons" role="group" data-i18n-aria-label="rehearsalScenarios">
            <button class="scenario-button" id="rehearse-quiet" type="button" data-scenario="quiet" aria-pressed="true" data-i18n="quietChat"></button>
            <button class="scenario-button" id="rehearse-flood" type="button" data-scenario="flood" aria-pressed="false" data-i18n="messageFlood"></button>
            <button class="scenario-button" id="rehearse-raid" type="button" data-scenario="raid" aria-pressed="false" data-i18n="raid"></button>
            <button class="scenario-button" id="rehearse-sub" type="button" data-scenario="sub" aria-pressed="false" data-i18n="sub"></button>
            <button class="scenario-button" id="rehearse-bits" type="button" data-scenario="bits" aria-pressed="false" data-i18n="bits"></button>
          </div>
          <span class="footer-spacer"></span>
          <span class="value-readout" id="test-output-hint"></span>
          <div class="footer-actions">
            <button class="button button-primary" id="test-in-obs" type="button" data-i18n="testInObs" disabled></button>
            <button class="button button-quiet" id="share-look" type="button" data-i18n="shareLook"></button>
          </div>
        </section>
        <div class="toast" id="toast" role="status" aria-live="polite">
          <span id="toast-text"></span>
          <button class="toast-close" id="toast-close" type="button" data-i18n-aria-label="close">×</button>
        </div>
      </footer>
    </div>

    <dialog id="account-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button class="small-button" id="dialog-x" type="button" data-i18n-aria-label="close">×</button></div>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-footer"><button class="button" id="dialog-close" type="button" data-i18n="dialogClose"></button></div>
    </dialog>
    <dialog id="publish-dialog" aria-labelledby="publish-dialog-title">
      <form id="publish-form" novalidate>
        <div class="dialog-head"><h2 id="publish-dialog-title" data-i18n="shareLook"></h2><button class="small-button" id="publish-x" type="button" data-i18n-aria-label="close">×</button></div>
        <div class="dialog-body publish-dialog-body">
          <label class="control-label" for="publish-name" data-i18n="publishNameLabel"></label>
          <input class="dialog-input" id="publish-name" name="name" type="text" maxlength="40" autocomplete="off" required />
          <p class="dialog-state" id="publish-status" role="status" aria-live="polite"></p>
          <a id="publish-open" class="publish-open" href="#" data-i18n="open" hidden></a>
          <div class="limit-row" id="publish-limit" hidden>
            <span data-i18n="lookLimitStatus"></span>
            <button type="button" class="small-button" id="publish-manage-looks" data-i18n="manageLooks"></button>
          </div>
        </div>
        <div class="dialog-footer">
          <button class="button button-quiet" id="publish-cancel" type="button" data-i18n="dialogClose"></button>
          <button class="button button-primary" id="publish-submit" type="submit" data-i18n="publishSubmit" disabled></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./studio.ts"></script>
  </body>
</html>
