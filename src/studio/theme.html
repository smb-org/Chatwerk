<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17181B" />
    <title>Chatwerk</title>
  </head>
  <body>
    <div class="gallery-shell public-look-shell" id="public-look-page">
      <header class="studio-header gallery-header">
        <a class="wordmark" href="/themes" data-i18n="brand"></a>
        <nav class="top-nav" data-i18n-aria-label="primaryNavigation">
          <a href="/studio" data-i18n="studioTitle"></a>
          <a href="/themes" data-i18n="themes"></a>
          <a href="/studio/export" data-i18n="setup"></a>
        </nav>
        <div class="header-spacer"></div>
        <a class="button public-login" id="public-login" href="#" data-i18n="loginButton" hidden></a>
        <span class="gallery-active-overlay" id="active-overlay-name" hidden>
          <span id="active-overlay-text"></span>
          <select id="active-overlay-select" data-i18n-aria-label="activeOverlayLabel" hidden></select>
        </span>
        <details class="account-menu" id="account-menu" hidden>
          <summary data-i18n="account"></summary>
          <div class="account-popover"><a href="/studio" data-i18n="studioTitle"></a></div>
        </details>
      </header>

      <main class="public-look-main">
        <p class="product-sentence" data-i18n="loginProduct"></p>
        <section class="look-detail public-look-detail" id="look-detail" data-i18n-aria-label="preview">
          <header class="look-detail-head">
            <div class="look-heading-copy">
              <h1 id="look-name" class="look-title" data-i18n="lookLoading"></h1>
              <p id="look-author" class="look-author"></p>
              <p id="look-lineage" class="look-lineage"></p>
            </div>
            <div class="look-primary-action">
              <a class="button button-primary" id="public-copy-login" href="#" data-i18n="loginToCopy" hidden></a>
              <button class="button button-primary" id="use-look" type="button" data-i18n="useOnOverlay" hidden disabled></button>
              <span class="look-copy-hint" id="look-copy-hint" data-i18n="copyCssHint" hidden></span>
            </div>
          </header>
          <div class="look-stage" id="look-stage">
            <span class="sample-label" data-i18n="sampleChat"></span>
            <div class="gallery-frame-wrap" id="gallery-frame-wrap">
              <iframe id="look-preview" title="" sandbox="allow-scripts" src="/overlay#client=studio" tabindex="-1"></iframe>
            </div>
            <span class="preview-meta" id="look-preview-status" data-i18n="previewScale" data-percent="100"></span>
          </div>
          <div class="look-rehearse" data-i18n-aria-label="rehearseControls">
            <span class="footer-title" data-i18n="rehearse"></span>
            <div class="scenario-buttons" role="group" data-i18n-aria-label="rehearsalScenarios">
              <button class="scenario-button" type="button" data-scenario="quiet" aria-pressed="true" data-i18n="quietChat"></button>
              <button class="scenario-button" type="button" data-scenario="flood" aria-pressed="false" data-i18n="messageFlood"></button>
              <button class="scenario-button" type="button" data-scenario="raid" aria-pressed="false" data-i18n="raid"></button>
              <button class="scenario-button" type="button" data-scenario="sub" aria-pressed="false" data-i18n="sub"></button>
              <button class="scenario-button" type="button" data-scenario="bits" aria-pressed="false" data-i18n="bits"></button>
            </div>
          </div>
          <dl class="look-values" id="look-values" data-i18n-aria-label="lookValues">
            <div><dt data-i18n="fieldFontFamily"></dt><dd data-value="fontFamily"></dd></div>
            <div><dt data-i18n="fieldFontSize"></dt><dd data-value="fontSize"></dd></div>
            <div><dt data-i18n="fieldTextColor"></dt><dd data-value="textColor"></dd></div>
            <div><dt data-i18n="fieldBackgroundColor"></dt><dd data-value="backgroundColor"></dd></div>
            <div><dt data-i18n="fieldBackgroundOpacity"></dt><dd data-value="backgroundOpacity"></dd></div>
            <div><dt data-i18n="fieldSpacing"></dt><dd data-value="spacing"></dd></div>
          </dl>
          <div class="public-look-state" id="public-look-state" role="status" aria-live="polite"></div>
        </section>
      </main>
      <footer class="gallery-mobile-action">
        <span data-i18n="copyCssHint"></span>
        <a class="button button-primary" id="public-copy-login-mobile" href="#" data-i18n="loginToCopy" hidden></a>
        <button class="button button-primary" id="use-look-mobile" type="button" data-i18n="useOnOverlay" hidden disabled></button>
      </footer>
      <div class="gallery-toast" id="gallery-toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./look-page.ts"></script>
  </body>
</html>
